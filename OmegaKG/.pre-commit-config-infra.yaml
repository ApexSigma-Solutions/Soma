# .pre-commit-config-infra.yaml
# Docker/shell-based infrastructure checks
# Run via: scripts/pre-commit-full.ps1 or in CI/CD

repos:
  # Include all Python checks from main config
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008, --ignore, DL3009]

  # Security scanning (Docker required)
  - repo: local
    hooks:
      - id: trivy-fs
        name: Trivy filesystem scan
        entry: docker run --rm -v .:/workspace aquasec/trivy:latest fs --scanners vuln,secret,config /workspace
        language: system
        pass_filenames: false

      - id: docker-compose-validate
        name: Validate docker-compose files
        entry: docker compose config
        language: system
        files: docker-compose.*\.ya?ml$
        pass_filenames: true
