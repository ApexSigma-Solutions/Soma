[tool.poetry]
name = "omega_kg"
version = "0.1.0"
description = "General-purpose Python project managed by Poetry"
authors = [
    "SigmaDev11 <steynsean11@gmail.com>"
]
readme = "README.md"
package-mode = true
packages = [
    { include = "omega_kg" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
python-frontmatter = ">=1.1.0,<2.0.0"
pydantic-settings = ">=2.11.0,<3.0.0"
tabulate = ">=0.9.0,<1.0.0"
neo4j = ">=6.0.0,<7.0.0"
click = ">=8.0,<9.0"
fastapi = ">=0.120.0,<0.121.0"
uvicorn = {version = ">=0.38.0,<0.39.0", extras = ["standard"]}
apscheduler = ">=3.11.0,<4.0.0"
pyjwt = {version = "^2.10.0", extras = ["crypto"]}
passlib = {version = ">=1.7.4,<2.0.0", extras = ["bcrypt"]}
beautifulsoup4 = ">=4.14.2,<5.0.0"
httpx = ">=0.28.1,<0.29.0"
spacy = ">=3.7.0,<4.0.0"
bitwarden-sdk = ">=1.0.0,<2.0.0"
sqlalchemy = {version = ">=2.0.0", extras = ["asyncio"]}
alembic = ">=1.13.0"
asyncpg = ">=0.29.0"
pgvector = ">=0.2.0"
tenacity = ">=8.2.0"
psycopg2-binary = ">=2.9.0,<3.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
requests = ">=2.31.0,<3.0.0"
psutil = ">=7.1.3,<8.0.0"
redis = ">=5.0.0,<6.0.0"
pyngrok = ">=7.5.0"
openai = ">=1.10.0"
sse-starlette = "^3.1.2"
memos-mcp = "^0.1.0"
email-validator = "^2.3.0"
structlog = "^25.5.0"
watchfiles = "^1.1.1"
rich = "^14.2.0"

[tool.poetry.scripts]
omega = "omega_kg.cli:cli"
capture-server = "omega_kg.capture_server:main"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"
pre-commit = "^4.3.0"
ruff = "^0.14.1"
ipython = "^9.6.0"
pytest-dotenv = "^0.5.2"

mypy = "^1.14.0"
bandit = "^1.8.0"
pytest-asyncio = "^0.23.0"
testcontainers = {extras = ["neo4j", "postgres"], version = "^4.13.3"}
pytest = "^9.0.2"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.22"
mkdocstrings = {extras = ["python"], version = "^0.30.1"}

[tool.coverage.run]
source = ["omega_kg"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
files = ["omega_kg"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = "Test*"
python_functions = "test_*"
pythonpath = "."

# Command line options
addopts = "-v --tb=short --strict-markers --strict-config --no-header"

# Markers (Migrated from your pytest.ini)
markers = [
    "unit: unit tests - isolated, fast, no external dependencies",
    "integration: integration tests - require external services (Neo4j, Linear, etc.)",
    "slow: slow running tests - long execution time, use with -m 'not slow'",
    "requires_neo4j: tests that require Neo4j database connection",
    "not_requires_neo4j: tests that do not require Neo4j database connection",
    "requires_postgres: tests that require PostgreSQL database connection",
    "requires_linear: tests requiring Linear API integration",
    "requires_obsidian: tests requiring Obsidian vault access",
    "requires_ollama: tests requiring Ollama service",
    "smoke: smoke tests - basic functionality verification",
    "regression: regression tests - comprehensive coverage",
    "performance: performance benchmarks and load tests",
    "security: security compliance and vulnerability tests",
    "e2e: end-to-end tests spanning multiple components",
    "mock: tests using mocked dependencies",
    "live: tests requiring live external services",
    "capture_server: mark test as capture server test"
]

# Warnings Configuration
# CRITICAL FIX: Changed 'error::DeprecationWarning' to 'ignore' to allow Testcontainers to run
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
    "ignore:.*event_loop.*:DeprecationWarning"
]

# Logging
log_cli = true
log_cli_level = "INFO"

# Asyncio
asyncio_mode = "auto"
