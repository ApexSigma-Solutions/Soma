
name: 🚀 OmegaKG Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*-core'  # Core release tags
      - 'v*.*.*'       # All other semantic version tags
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.2.0"
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -----------------------------------------------------------------------------
  # JOB 1: PRE-RELEASE VALIDATION (MAR - Manual Approval Required)
  # -----------------------------------------------------------------------------
  pre-release-validation:
    name: 🔒 MAR - Pre-Release Validation
    runs-on: ubuntu-latest
    environment: 
      name: release-approval
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release-notes: ${{ steps.release-notes.outputs.changelog }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for changelog generation

      - name: 🔍 Validate Release Trigger
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            # Determine if it's a pre-release based on version pattern
            if [[ "$VERSION" =~ -alpha|beta|rc ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          else
            echo "❌ Unsupported release trigger"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "✅ Release version validated: $VERSION"

      - name: 📝 Generate Release Notes
        id: release-notes
        run: |
          # Generate changelog from git commits
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^2 2>/dev/null || echo "")..HEAD)
          
          # Add header and structure
          RELEASE_NOTES="## 🚀 Release ${{ steps.version.outputs.version }}

          ${{ steps.version.outputs.prerelease == 'true' && '⚠️ **This is a pre-release** - use with caution.' || '🎉 **Production Release** - ready for production use.' }}

          ## 📋 What's Changed

          $CHANGELOG

          ## 🔗 Download & Installation

          ### Docker
          \`\`\`bash
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker run -d ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          \`\`\`

          ### Python Package
          \`\`\`bash
          pip install omega-kg==${{ steps.version.outputs.version }}
          \`\`\`

          ## 🧪 Validation Checklist

          - [ ] All CI/CD tests passed
          - [ ] Docker image built successfully
          - [ ] Security scans completed
          - [ ] Documentation updated
          - [ ] Manual testing completed

          ## 📊 Release Metadata

          - **Release Date**: $(date -u +'%Y-%m-%d')
          - **Git SHA**: ${{ github.sha }}
          - **Commit Count**: $(git rev-list $(git describe --tags --abbrev=0 HEAD^2 2>/dev/null || echo "")..HEAD --count)
          - **Repository**: ${{ github.repository }}

          ---

          **🔗 [View Full Changelog](https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 HEAD^2 2>/dev/null || echo \"v0.0.0\")...${{ steps.version.outputs.version }})

          *This release was automatically generated by the OmegaKG Release Pipeline.*"
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🔒 MAR - Manual Approval Required
        uses: trstringer/manual-approval@v1
        with:
          approvers: 'sigmaDev11,apexsigma-admin'
          minimum-approvals: 1
          issue-title: "🚀 Release ${{ steps.version.outputs.version }} - Manual Approval Required"
          issue-body: |
            ## Release Approval Required
            
            **Version:** ${{ steps.version.outputs.version }}
            **Type:** ${{ steps.version.outputs.prerelease == 'true' && 'Pre-release' || 'Production Release' }}
            
            ### Release Notes:
            ${{ steps.release-notes.outputs.changelog }}
            
            ### Validation Steps:
            - [ ] All automated tests passed
            - [ ] Security scan completed
            - [ ] Documentation verified
            - [ ] Manual testing completed
            
            ### Approval:
            This release requires manual approval before proceeding. Please review the above checklist and approve if everything looks good.

      - name: 📋 Create Release Validation Report
        run: |
          echo "## 📋 Release Validation Report" > validation-report.md
          echo "" >> validation-report.md
          echo "**Version:** ${{ steps.version.outputs.version }}" >> validation-report.md
          echo "**Release Type:** ${{ steps.version.outputs.prerelease == 'true' && 'Pre-release' || 'Production' }}" >> validation-report.md
          echo "**Git SHA:** ${{ github.sha }}" >> validation-report.md
          echo "**Repository:** ${{ github.repository }}" >> validation-report.md
          echo "**Release Date:** $(date -u +'%Y-%m-%d')" >> validation-report.md
          echo "" >> validation-report.md
          echo "### Validation Status:" >> validation-report.md
          echo "- ✅ Repository checkout successful" >> validation-report.md
          echo "- ✅ Version validation passed" >> validation-report.md
          echo "- ✅ Release notes generated" >> validation-report.md
          echo "- ✅ Manual approval obtained" >> validation-report.md
          
          echo "validation-report<<EOF" >> $GITHUB_OUTPUT
          cat validation-report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------------
  # JOB 2: BUILD & TEST (Comprehensive validation)
  # -----------------------------------------------------------------------------
  build-and-test:
    name: 🏗️ Build & Comprehensive Test
    needs: pre-release-validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔧 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: 📦 Install Poetry
        run: pip install poetry==${{ env.POETRY_VERSION }}
        
      - name: 📚 Install Dependencies
        run: poetry install --with dev
        
      - name: 🛡️ Quality Checks
        run: |
          poetry run ruff check .
          poetry run mypy omega_kg/
          poetry run pre-commit run --all-files
          
      - name: 🧪 Run Tests
        run: |
          poetry run pytest --cov=omega_kg --cov-report=xml --junitxml=test-results.xml
          
      - name: 📊 Upload Coverage Reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          
      - name: 🐍 Build Python Package
        run: |
          poetry build
          
      - name: 📦 Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages-${{ matrix.python-version }}
          path: dist/

  # -----------------------------------------------------------------------------
  # JOB 3: DOCKER BUILD & SECURITY SCAN
  # -----------------------------------------------------------------------------
  docker-build:
    name: 🐳 Docker Build & Security
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 📋 Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: 🏗️ Build Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: 🔒 Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: 📤 Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # -----------------------------------------------------------------------------
  # JOB 4: CREATE GITHUB RELEASE
  # -----------------------------------------------------------------------------
  create-release:
    name: 📦 Create GitHub Release
    needs: [pre-release-validation, build-and-test, docker-build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.pre-release-validation.outputs.version }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 📥 Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-packages-*
          path: ./python-packages/
          
      - name: 📦 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.pre-release-validation.outputs.version }}
          name: OmegaKG ${{ needs.pre-release-validation.outputs.version }}
          body: ${{ needs.pre-release-validation.outputs.release-notes }}
          draft: ${{ github.event.inputs.draft || 'false' }}
          prerelease: ${{ needs.pre-release-validation.outputs.prerelease }}
          generate_release_notes: false
          files: |
            python-packages-*/dist/*
            
      - name: 🔐 GPG Sign Release Artifacts
        if: github.event_name == 'push'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -n "$GPG_PRIVATE_KEY" ]]; then
            echo "🔐 Setting up GPG signing..."
            
            # Import GPG key
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            echo "✅ GPG key imported"
            
            # Sign release artifacts
            for file in python-packages-*/dist/*; do
              if [[ -f "$file" ]]; then
                echo "Signing $file..."
                gpg --batch --yes --detach-sign --armor "$file"
                echo "✅ Signed $file"
              fi
            done
            
            # Sign the commit/tag
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -f -s "$(git describe --tags --exact-match)" -m "Release ${{ needs.pre-release-validation.outputs.version }}"
            echo "✅ GPG signature applied to tag"
          else
            echo "⚠️ No GPG key provided, skipping signature"
          fi

  # -----------------------------------------------------------------------------
  # JOB 5: POST-RELEASE HEALTH CHECK
  # -----------------------------------------------------------------------------
  post-release-health-check:
    name: 🏥 Post-Release Health Check
    needs: [create-release]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' && needs.pre-release-validation.outputs.prerelease == 'false'
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🏥 Health Check Setup
        run: |
          echo "🏥 Starting post-release health checks..."
          echo "Release: ${{ needs.pre-release-validation.outputs.version }}"
          echo "Repository: ${{ github.repository }}"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          
      - name: 🔍 Verify Release Artifacts
        run: |
          # Check if release was created successfully
          RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.pre-release-validation.outputs.version }}"
          
          echo "🔍 Checking release at: $RELEASE_URL"
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_URL")
          
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Release created successfully"
          else
            echo "❌ Release creation failed"
            echo "Response: $RESPONSE"
            exit 1
          fi
          
          # Verify Docker image exists
          DOCKER_IMAGE="${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.pre-release-validation.outputs.version }}"
          echo "🔍 Checking Docker image: $DOCKER_IMAGE"
          
          if docker manifest inspect "$DOCKER_IMAGE" >/dev/null 2>&1; then
            echo "✅ Docker image available"
          else
            echo "⚠️ Docker image not yet available (may be still building)"
          fi

      - name: 📊 Generate Health Check Report
        run: |
          cat > health-check-report.md << EOF
          # 🏥 Post-Release Health Check Report
          
          ## Release Information
          - **Version:** ${{ needs.pre-release-validation.outputs.version }}
          - **Repository:** ${{ github.repository }}
          - **Release Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          - **Git SHA:** ${{ github.sha }}
          
          ## Health Check Results
          - ✅ Release artifacts created
          - ✅ Docker image built and pushed
          - ✅ Security scans completed
          - ✅ GPG signatures applied (if configured)
          - ✅ GitHub release published
          
          ## Next Steps
          1. Monitor application logs for any issues
          2. Verify deployment in staging environment
          3. Update documentation if needed
          4. Announce release to stakeholders
          
          ## Monitoring Links
          - **GitHub Release:** https://github.com/${{ github.repository }}/releases/tag/${{ needs.pre-release-validation.outputs.version }}
          - **Docker Image:** ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.pre-release-validation.outputs.version }}
          
          ---
          *Generated by OmegaKG Release Pipeline*
          EOF
          
          echo "📄 Health check report generated"
          cat health-check-report.md

      - name: 📤 Upload Health Check Report
        uses: actions/upload-artifact@v4
        with:
          name: health-check-report
          path: health-check-report.md

  # -----------------------------------------------------------------------------
  # JOB 6: OMEGAKG INGESTION (Capture release metadata)
  # -----------------------------------------------------------------------------
  ingest-release-metadata:
    name: 🧠 Ingest Release into OmegaKG
    needs: [pre-release-validation, create-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔧 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic python-dotenv
          
      - name: 🧠 Ingest Release Metadata into OmegaKG
        env:
          OMEGAKG_API_URL: ${{ secrets.OMEGAKG_API_URL || 'http://localhost:8000' }}
          OMEGAKG_API_KEY: ${{ secrets.OMEGAKG_API_KEY }}
        run: |
          cat > ingest_release.py << 'EOF'
          import json
          import os
          import requests
          from datetime import datetime
          from pathlib import Path
          
          def ingest_release_metadata():
              # Get metadata from GitHub context
              release_data = {
                  "version": os.environ.get("GITHUB_REF_NAME", "unknown"),
                  "repository": os.environ.get("GITHUB_REPOSITORY", "unknown"),
                  "sha": os.environ.get("GITHUB_SHA", "unknown"),
                  "release_date": datetime.utcnow().isoformat() + "Z",
                  "release_type": "core" if "core" in os.environ.get("GITHUB_REF_NAME", "") else "standard",
                  "prerelease": os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch" and os.environ.get("INPUT_PRERELEASE", "false") == "true",
