[tool.poetry]
name = "soma"
version = "0.1.0"
description = "Soma: The Distributed Organism - A biomorphic knowledge ecosystem"
authors = ["SigmaDev11 <steynsean11@gmail.com>"]
readme = "README.md"
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/.git",
    "OmegaVault",
    "logs",
    "docs",
    "**/test_vault"
]

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "node_modules",
    "OmegaVault",
    "logs",
    "docs",
    "test_vault"
]
line-length = 88

[dependency-groups]
dev = [
    "ruff>=0.14.14",
]
